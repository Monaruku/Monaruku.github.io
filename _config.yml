title: Monaruku
description: Portfolio & writing by Monaruku
baseurl: ""
url: ""

markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

collections:
  projects:
    output: true
    permalink: /work/:path/
  photo_albums:
    output: true
    permalink: /photography/:path/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: photo_albums
    values:
      layout: photo_album
      photography: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - PRODUCT.md
  - DESIGN.md
  - .gitignore
  - MysticTarot-Spec.md
  - BudgetTracker-Spec.md
  - preview.html
  - vibe_images
  - vendor
  - _photo_albums/_template.md
